blueprint:
  name: "FamFam: events tomorrow"
  description: >-
    At a chosen time each evening, look up tomorrow's events on a FamFam
    calendar — and if there are any, send a notification, set a light
    colour, or both.
  domain: automation
  homeassistant:
    min_version: "2025.8.0"
  source_url: https://github.com/bencom-tech/famfam-homeassistant/blob/main/blueprints/automation/famfam/event_tomorrow.yaml
  input:
    calendar_entity:
      name: Calendar
      description: >-
        A FamFam calendar — the family calendar, or a member's for that
        member's events only.
      selector:
        entity:
          filter:
            integration: famfam
            domain: calendar
    check_time:
      name: Check time
      default: "19:00:00"
      selector:
        time:
    notify_service:
      name: Notify action
      description: >-
        A notify action such as notify.mobile_app_alexs_phone. Leave empty
        for no notification.
      default: ""
      selector:
        text:
    lights:
      name: Lights
      description: Lights to colour as a reminder. Leave empty for none.
      default: []
      selector:
        entity:
          filter:
            domain: light
          multiple: true
    light_colour:
      name: Light colour
      default: [255, 140, 0]
      selector:
        color_rgb:

triggers:
  - trigger: time
    at: !input check_time

variables:
  calendar_entity: !input calendar_entity
  notify_service: !input notify_service
  lights: !input lights

actions:
  # Read tomorrow straight from the calendar. The "Next event" sensor only
  # reports the single soonest event, so anything still on later tonight
  # would hide tomorrow's.
  - action: calendar.get_events
    target:
      entity_id: !input calendar_entity
    data:
      start_date_time: >-
        {{ (today_at() + timedelta(days=1)).isoformat() }}
      duration:
        hours: 24
    response_variable: agenda
  - variables:
      events: "{{ agenda[calendar_entity].events }}"
  - condition: template
    value_template: "{{ events | count > 0 }}"
  - if:
      - condition: template
        value_template: "{{ notify_service != '' }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: "On tomorrow"
          # start is a date for all-day events and an ISO datetime for timed
          # ones; the time, when there is one, is characters 11 to 16.
          message: >-
            {% for event in events %}{{ event.summary }}{% if event.start | length > 10 %}
            at {{ event.start[11:16] }}{% endif %}{{ ', ' if not loop.last else '.' }}{% endfor %}
  - if:
      - condition: template
        value_template: "{{ lights | count > 0 }}"
    then:
      - action: light.turn_on
        target:
          entity_id: !input lights
        data:
          rgb_color: !input light_colour

mode: single
