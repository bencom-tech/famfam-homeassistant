blueprint:
  name: "FamFam: event tomorrow"
  description: >-
    At a chosen time each evening, check whether the next family event is
    tomorrow — and if so, send a notification, set a light colour, or
    both.
  domain: automation
  homeassistant:
    min_version: "2025.8.0"
  source_url: https://github.com/runoutking/famfam-homeassistant/blob/main/blueprints/automation/famfam/event_tomorrow.yaml
  input:
    next_event_sensor:
      name: Next event sensor
      description: >-
        A FamFam "Next event" sensor — the family's, or a member's for
        that member's events only.
      selector:
        entity:
          filter:
            integration: famfam
            domain: sensor
    check_time:
      name: Check time
      default: "19:00:00"
      selector:
        time:
    notify_service:
      name: Notify action
      description: >-
        A notify action such as notify.mobile_app_alexs_phone. Leave empty
        for no notification.
      default: ""
      selector:
        text:
    lights:
      name: Lights
      description: Lights to colour as a reminder. Leave empty for none.
      default: []
      selector:
        entity:
          filter:
            domain: light
          multiple: true
    light_colour:
      name: Light colour
      default: [255, 140, 0]
      selector:
        color_rgb:

triggers:
  - trigger: time
    at: !input check_time

variables:
  next_event_sensor: !input next_event_sensor
  notify_service: !input notify_service
  lights: !input lights
  event_start: "{{ state_attr(next_event_sensor, 'start') or '' }}"

conditions:
  # The start attribute is a date for all-day events and an ISO datetime
  # for timed ones — the first ten characters are the date either way.
  - condition: template
    value_template: >-
      {{ event_start[:10] == (now() + timedelta(days=1)).date().isoformat() }}

actions:
  - if:
      - condition: template
        value_template: "{{ notify_service != '' }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: "On tomorrow"
          message: >-
            Tomorrow: {{ states(next_event_sensor) }}
            {%- if event_start | length > 10 %}
            at {{ event_start[11:16] }}
            {%- endif %}.
  - if:
      - condition: template
        value_template: "{{ lights | count > 0 }}"
    then:
      - action: light.turn_on
        target:
          entity_id: !input lights
        data:
          rgb_color: !input light_colour

mode: single
